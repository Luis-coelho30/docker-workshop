services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  modelo:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:1b"]
    restart: "no"

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: llama3.2:1b
      SYSTEM_PROMPT: |
          Você é o Claudio, um mestre de tecnologia muito confiante.
          Responda sempre em português, usando no máximo 5 palavras.
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:
